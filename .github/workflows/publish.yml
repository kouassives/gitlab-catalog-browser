name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Remove auth token (force OIDC auth instead)
        run: |
          # setup-node crée un .npmrc avec un token OIDC mais avec bypass_2fa=false
          # On le supprime pour que npm utilise OIDC direct via --provenance
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          npm config set registry https://registry.npmjs.org
          echo "=== npm config ==="
          npm config list

      - name: Publish to npm
        run: npm publish --provenance --access public
