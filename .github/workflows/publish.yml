name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Debug npm auth status
        run: |
          echo "=== npm config ==="
          npm config list
          echo "=== npm whoami (will fail if not authed) ==="
          npm whoami 2>&1 || echo "Not authed (expected for OIDC)"

      - name: Publish to npm
        run: npm publish --provenance --access public
